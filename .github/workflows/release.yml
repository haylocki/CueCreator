
name: Build Linux and Windows Releases

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Archive
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Create release archive
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          ARCHIVE_NAME="CueCreator-${TAG_NAME}-Linux.tar.gz"

          git archive \
            --format=tar.gz \
            --prefix="CueCreator-${TAG_NAME}/" \
            "$GITHUB_SHA" \
            > "$ARCHIVE_NAME"

          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> "$GITHUB_ENV"

      - name: Upload Linux archive
        uses: actions/upload-artifact@v6
        with:
          name: linux-release
          path: ${{ env.ARCHIVE_NAME }}

  build-windows:
    name: Build Windows Archive
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Create release archive
        shell: pwsh
        run: |
          $tagName = "${{ github.ref_name }}"
          $archiveName = "CueCreator-$tagName-Windows.zip"
          $archiveDirectory = "CueCreator-$tagName"

          New-Item -ItemType Directory -Path $archiveDirectory | Out-Null

          git archive --format=tar HEAD |
            tar -xf - -C $archiveDirectory

          Compress-Archive `
            -Path "$archiveDirectory\*" `
            -DestinationPath $archiveName `
            -Force

      - name: Upload Windows archive
        uses: actions/upload-artifact@v6
        with:
          name: windows-release
          path: CueCreator-${{ github.ref_name }}-Windows.zip

  create-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]

    steps:
      - name: Download Linux archive
        uses: actions/download-artifact@v6
        with:
          name: linux-release

      - name: Download Windows archive
        uses: actions/download-artifact@v6
        with:
          name: windows-release

      - name: Create release and upload archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"

          if ! gh release view "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --generate-notes
          fi

          gh release upload "$TAG_NAME" \
            CueCreator-"$TAG_NAME"-Linux.tar.gz \
            CueCreator-"$TAG_NAME"-Windows.zip \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
